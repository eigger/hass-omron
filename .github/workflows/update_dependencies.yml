# Shared standards: eigger/hass-repo-standards@ff46b0c8d9ba
name: Update dependencies
'on':
  schedule:
  - cron: 41 4 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  dependencies:
    permissions:
      contents: write
      pull-requests: write
    uses: eigger/hass-repo-standards/.github/workflows/dependency-update.yml@ff46b0c8d9ba53b1d35ab9a4aa38f4db26c06870
    with:
      domain: omron
      packages: '["blesession"]'
      ha-components: bluetooth bluetooth_adapters usb
      python-version: '3.14'
      test-profile: ha
      validation-command: python -m ruff check . && python -m ruff format --check . && python -m pytest tests/components/omron/ -v --timeout 120
