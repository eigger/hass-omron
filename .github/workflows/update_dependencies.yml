# Shared standards: eigger/hass-repo-standards@0ec31111a81b
name: Update dependencies
'on':
  schedule:
  - cron: 41 4 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  dependencies:
    permissions:
      contents: write
      pull-requests: write
    uses: eigger/hass-repo-standards/.github/workflows/dependency-update.yml@ca740d88b32fa5dcbc94c41fce2908450c76ed50
    with:
      standards-ref: ca740d88b32fa5dcbc94c41fce2908450c76ed50
      domain: omron
      packages: '["blesession"]'
      ha-components: bluetooth bluetooth_adapters usb
      python-version: '3.14'
      test-profile: ha
      validation-command: python -m ruff check . && python -m ruff format --check . && python -m pytest tests/components/omron/ -v --timeout 120
