# Shared standards: eigger/hass-repo-standards@ff46b0c8d9ba
name: Tests
'on':
  push:
    branches:
    - master
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@ff46b0c8d9ba53b1d35ab9a4aa38f4db26c06870
    with:
      domain: omron
      python-versions: '["3.14"]'
      requirements: requirements_test.txt
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["blesession"]'
      ha-components: bluetooth bluetooth_adapters usb
      expected-ha-version: '2026.9.3'
      test-profile: ha
      pytest-args: tests/components/omron/ -v --timeout 120
  minimum-ha:
    # hacs.json declares homeassistant 2025.12.0; keep this exact-minimum job.
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@ff46b0c8d9ba53b1d35ab9a4aa38f4db26c06870
    with:
      domain: omron
      python-versions: '["3.13"]'
      requirements: requirements_test_min.txt
      constraints: constraints/homeassistant-min.txt
      ha-components: bluetooth bluetooth_adapters usb
      expected-ha-version: '2025.12.0'
      test-profile: ha
      pytest-args: tests/components/omron/ -v --timeout 120
