name: Update blesession requirement

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: update-blesession
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-blesession:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install version parser
        run: python -m pip install packaging

      - name: Check and update blesession requirement
        id: update
        run: python scripts/update_blesession_requirement.py

      - name: Create or update pull request
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BLESSESSION_VERSION: ${{ steps.update.outputs.version }}
        run: |
          set -euo pipefail

          branch="dep-bump-blesession"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git checkout -B "${branch}"
          git add custom_components/omron/manifest.json

          if git diff --cached --quiet; then
            echo "No manifest change to commit."
            exit 0
          fi

          git commit -m "chore: bump blesession to ${BLESSESSION_VERSION}"
          git push --force origin "${branch}"

          existing_pr="$(gh pr list --head "${branch}" --base master --json number --jq '.[0].number' || true)"
          if [ -n "${existing_pr}" ] && [ "${existing_pr}" != "null" ]; then
            echo "Pull request already exists: #${existing_pr}"
          else
            gh pr create \
              --base master \
              --head "${branch}" \
              --title "chore: bump blesession to ${BLESSESSION_VERSION}" \
              --body "Automated dependency update: raises the minimum blesession requirement to ${BLESSESSION_VERSION}."
          fi
