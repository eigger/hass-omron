# Shared standards: eigger/hass-repo-standards@0ec31111a81b
name: Validate
'on':
  push:
    branches:
    - master
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 23 3 * * 1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: eigger/hass-repo-standards/.github/workflows/validate-integration.yml@0ec31111a81b0ee5702f1d8a17f03616a10a5db6
    with:
      hassfest-core-ref: ec18d8b25d1ee39aa8b85a72a170e42bee33228c
  standards:
    name: Central template compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.14'
    # Use the same reviewed standards SHA as the reusable workflows.
    - uses: eigger/hass-repo-standards/actions/check-standards@0ec31111a81b0ee5702f1d8a17f03616a10a5db6
