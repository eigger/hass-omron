# Shared standards: eigger/hass-repo-standards@ff46b0c8d9ba
name: Validate
'on':
  push:
    branches:
    - master
  pull_request: null
  workflow_dispatch: null
  schedule:
  - cron: 23 3 * * 1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: eigger/hass-repo-standards/.github/workflows/validate-integration.yml@ff46b0c8d9ba53b1d35ab9a4aa38f4db26c06870
